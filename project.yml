name: Goldfish
options:
  bundleIdPrefix: com.goldfish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Goldfish:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: ViewModels
      - path: Assets/GoldfishColors.swift
        group: Assets
      - path: Goldfish/Assets.xcassets
        group: Assets
    resources:
      - path: Goldfish/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pond.goldfish
        PRODUCT_NAME: Goldfish
        # User-visible app name. The product and bundle id stay "Goldfish"/
        # app.pond.goldfish — changing them would orphan installed users' data.
        INFOPLIST_KEY_CFBundleDisplayName: Goldfish
        INFOPLIST_FILE: Goldfish/Info.plist
        CODE_SIGN_ENTITLEMENTS: Goldfish/Goldfish.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
    entitlements:
      path: Goldfish/Goldfish.entitlements
    info:
      path: Goldfish/Info.plist
      properties:
        FeedbackSupportEmail: "goldfish.pond.app@gmail.com"
        GoldfishSupportURL: "https://goldfish-pond-support.bwjhhk9fbp.chatgpt.site/"
        GoldfishPrivacyPolicyURL: "https://goldfish-pond-support.bwjhhk9fbp.chatgpt.site/privacy"
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UILaunchScreen: {}
        CFBundleDisplayName: Goldfish
    dependencies: []
    scheme:
      testTargets:
        - GoldfishTests
      gatherCoverageData: true

  GoldfishTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        group: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldfish.app.tests
        PRODUCT_NAME: GoldfishTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Goldfish.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Goldfish"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Goldfish
